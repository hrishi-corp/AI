<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HRISHI</title>
  <!-- Three.js + Touch Orbit Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-green: #00ff66;
      --neon-red: #ff0055;
      --bg-dark: #030712;
      --hud-panel: rgba(3, 15, 29, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: #e2e8f0;
    }

    #viewport-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 24px) 20px env(safe-area-inset-bottom, 24px) 20px;
    }

    .interactive {
      pointer-events: auto;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--hud-panel);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.25);
      backdrop-filter: blur(10px);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--neon-red);
      box-shadow: 0 0 10px var(--neon-red);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      text-transform: uppercase;
    }

    .badge-info {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #94a3b8;
    }

    .hud-bottom {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .telemetry-card {
      background: var(--hud-panel);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 8px;
      padding: 14px 16px;
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #64748b;
      font-weight: 700;
    }

    .metric-value {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }

    .hud-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 1.5px;
      font-size: 12px;
      text-transform: uppercase;
      outline: none;
    }

    .hud-btn:active {
      background: rgba(0, 240, 255, 0.35);
    }
  </style>
</head>
<body>

  <div id="viewport-container"></div>

  <div class="hud-layer">
    <div class="hud-top interactive">
      <div class="title-group">
        <div id="net-badge" class="status-dot"></div>
        <div class="app-title">HRISHI // CORE</div>
      </div>
      <div id="ble-status" class="badge-info">STANDBY</div>
    </div>

    <div class="hud-bottom">
      <div class="telemetry-card interactive">
        <div class="metric-col">
          <span class="metric-label">GPS COORDINATES</span>
          <span id="gps-val" class="metric-value">ACQUIRING FIX...</span>
        </div>
        <button id="btn-reset" class="hud-btn interactive">RESET CAM</button>
      </div>
    </div>
  </div>

  <script>
    const OCI_HOST = "92.4.87.82:8000";
    let scene, camera, renderer, globe, beaconsGroup, controls;
    let ws = null;

    // Spin dynamics variables
    let spinVelocity = 0.001; 
    let isUserTouching = false;
    let touchStartX = 0;
    let touchStartTime = 0;

    function setDebug(msg) {
      const el = document.getElementById("ble-status");
      if (el) el.innerText = msg;
    }

    // --- 1. Holographic Earth ---
    function init3D() {
      const container = document.getElementById("viewport-container");
      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 240);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.8;
      controls.zoomSpeed = 1.2;
      controls.minDistance = 85;
      controls.maxDistance = 350;
      controls.enablePan = false;

      // Holographic Globe Surface
      const textureLoader = new THREE.TextureLoader();
      const earthTex = textureLoader.load(
        "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg"
      );

      const globeGeo = new THREE.SphereGeometry(70, 64, 64);
      const globeMat = new THREE.MeshPhongMaterial({
        map: earthTex,
        color: 0x00d4ff,
        emissive: 0x001a33,
        transparent: true,
        opacity: 0.88,
        shininess: 15
      });
      globe = new THREE.Mesh(globeGeo, globeMat);
      scene.add(globe);

      // Wireframe Outer Mesh
      const gridGeo = new THREE.SphereGeometry(71.8, 36, 36);
      const gridMat = new THREE.MeshBasicMaterial({
        color: 0x00f0ff,
        wireframe: true,
        transparent: true,
        opacity: 0.2
      });
      globe.add(new THREE.Mesh(gridGeo, gridMat));

      // Lighting
      scene.add(new THREE.AmbientLight(0x00f0ff, 0.9));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(100, 100, 150);
      scene.add(dirLight);

      beaconsGroup = new THREE.Group();
      globe.add(beaconsGroup);

      addStaticBeacon(19.0760, 72.8777, 0x00f0ff);
      addStaticBeacon(40.7128, -74.0060, 0x00ff66);
      addStaticBeacon(51.5074, -0.1278, 0x7000ff);
      addStaticBeacon(35.6762, 139.6503, 0xffaa00);

      setupTouchInteraction(renderer.domElement);
      window.addEventListener("resize", onWindowResize);
      animate();
    }

    // Touch gesture physics: Stops on slow touch; flings into orbit on quick swipe
    function setupTouchInteraction(dom) {
      dom.addEventListener("pointerdown", (e) => {
        isUserTouching = true;
        touchStartX = e.clientX;
        touchStartTime = performance.now();
        spinVelocity = 0; // Immediately stops auto-rotation while interacting
      });

      dom.addEventListener("pointerup", (e) => {
        isUserTouching = false;
        const deltaX = e.clientX - touchStartX;
        const deltaTime = Math.max(1, performance.now() - touchStartTime);
        const swipeSpeed = Math.abs(deltaX) / deltaTime; // px per millisecond

        if (swipeSpeed > 0.4) {
          // Fast flick detected: resume spinning in swipe direction
          spinVelocity = (deltaX > 0 ? 0.0035 : -0.0035) * Math.min(swipeSpeed, 1.5);
        } else {
          // Slow drag or tap: stay completely still
          spinVelocity = 0;
        }
      });
    }

    function latLonToVector3(lat, lon, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -(radius * Math.sin(phi) * Math.cos(theta)),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function addStaticBeacon(lat, lon, color) {
      const pos = latLonToVector3(lat, lon, 71);
      const geo = new THREE.SphereGeometry(1.6, 8, 8);
      const mat = new THREE.MeshBasicMaterial({ color: color });
      const pin = new THREE.Mesh(geo, mat);
      pin.position.copy(pos);
      beaconsGroup.add(pin);
    }

    function updateUserPin(lat, lon) {
      let pin = scene.getObjectByName("user_pin");
      const pos = latLonToVector3(lat, lon, 72);
      if (!pin) {
        const geo = new THREE.SphereGeometry(2.8, 12, 12);
        const mat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        pin = new THREE.Mesh(geo, mat);
        pin.name = "user_pin";
        globe.add(pin);
      }
      pin.position.copy(pos);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (globe && !isUserTouching && spinVelocity !== 0) {
        globe.rotation.y += spinVelocity;
      }

      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- 2. WebSocket Telemetry ---
    function connectSocket() {
      const badge = document.getElementById("net-badge");
      setDebug("CONNECTING...");

      try {
        const socketUrl = "ws://" + OCI_HOST + "/ws/phone_nord_node?token=ENCRYPTED_ALPHA_ROOT_TOKEN";
        ws = new WebSocket(socketUrl);

        ws.onopen = () => {
          badge.style.background = "var(--neon-green)";
          badge.style.boxShadow = "0 0 10px var(--neon-green)";
          setDebug("WS CONNECTED");
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === "SYSTEM_READY") {
              setDebug(msg.role + " // ONLINE");
            } else if (msg.type === "USER_GPS_UPDATE") {
              updateUserPin(msg.lat, msg.lon);
            }
          } catch (e) {
            console.log("Raw message:", event.data);
          }
        };

        ws.onerror = (err) => {
          badge.style.background = "var(--neon-red)";
          badge.style.boxShadow = "0 0 10px var(--neon-red)";
          setDebug("WS SEC BLOCKED");
        };

        ws.onclose = () => {
          badge.style.background = "var(--neon-red)";
          badge.style.boxShadow = "0 0 10px var(--neon-red)";
          setDebug("RETRYING...");
          setTimeout(connectSocket, 3500);
        };
      } catch (err) {
        badge.style.background = "var(--neon-red)";
        setDebug("WS FAIL");
      }
    }

    // --- 3. Robust High-Accuracy GPS Pipeline ---
    function initGPS() {
      if (!navigator.geolocation) {
        document.getElementById("gps-val").innerText = "GEO NOT SUPPORTED";
        return;
      }

      // First call coarse quick lock, then continuous watch with generous timeout
      navigator.geolocation.getCurrentPosition(
        (pos) => handlePos(pos),
        (err) => {
          // If high-accuracy times out, fallback to cellular/wifi location
          navigator.geolocation.getCurrentPosition(handlePos, handleGeoErr, {
            enableHighAccuracy: false,
            timeout: 20000,
            maximumAge: 60000
          });
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 30000 }
      );

      // Continuous tracking
      navigator.geolocation.watchPosition(handlePos, handleGeoErr, {
        enableHighAccuracy: true,
        timeout: 30000,
        maximumAge: 10000
      });
    }

    function handlePos(pos) {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      document.getElementById("gps-val").innerText = lat.toFixed(4) + "°, " + lon.toFixed(4) + "°";
      updateUserPin(lat, lon);

      fetch("http://" + OCI_HOST + "/api/telemetry/geo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id: 1,
          lat: lat,
          lon: lon,
          altitude: pos.coords.altitude || 0,
          speed: pos.coords.speed || 0
        })
      }).catch(() => {});
    }

    function handleGeoErr(err) {
      if (err.code === 1) document.getElementById("gps-val").innerText = "LOCATION OFF";
      else if (err.code === 2) document.getElementById("gps-val").innerText = "NO GPS FIX";
      else if (err.code === 3) document.getElementById("gps-val").innerText = "GPS TIMEOUT (RETRYING)";
    }

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (controls) controls.reset();
      if (camera) camera.position.set(0, 0, 240);
      spinVelocity = 0.001; // Restores standard gentle orbit
    });

    window.addEventListener("DOMContentLoaded", () => {
      init3D();
      connectSocket();
      initGPS();
    });
  </script>
</body>
</html>
