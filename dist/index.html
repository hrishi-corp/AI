<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HRISHI</title>
  
  <!-- Three.js (Mode 1: Holographic Globe) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Leaflet Core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Dexie (IndexedDB Storage for Local Tiles) -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>

  <!-- Leaflet Routing Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-green: #00ff66;
      --neon-red: #ff0055;
      --panel-bg: rgba(6, 11, 25, 0.90);
      --border-cyan: rgba(0, 240, 255, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }

    #globe-container, #satellite-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    #satellite-container { display: none; z-index: 10; }

    .hud-header {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100; pointer-events: none;
    }
    .status-badge {
      display: flex; align-items: center; gap: 8px;
      background: var(--panel-bg); border: 1px solid var(--border-cyan);
      padding: 6px 12px; border-radius: 4px; pointer-events: auto;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neon-red); }

    .mode-controls {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 100;
    }
    .mode-btn {
      background: var(--panel-bg); color: var(--neon-cyan);
      border: 1px solid var(--border-cyan); padding: 10px 14px;
      font-size: 11px; font-weight: bold; letter-spacing: 1px;
      border-radius: 4px; cursor: pointer; text-transform: uppercase;
    }
    .mode-btn.active {
      background: rgba(0, 240, 255, 0.25);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }
    .leaflet-routing-container { display: none !important; }
    .leaflet-container { background: #000; }
  </style>
</head>
<body>

  <!-- Mode 1: 3D Globe -->
  <div id="globe-container"></div>

  <!-- Mode 2: Tactical Satellite -->
  <div id="satellite-container"></div>

  <!-- HUD Status Bar -->
  <div class="hud-header">
    <div class="status-badge">
      <div id="net-badge" class="status-dot"></div>
      <span id="node-status" style="color: var(--neon-cyan);">ALPHA // SYS INIT</span>
    </div>
    <div class="status-badge">
      <span id="offline-status" style="color: var(--neon-green);">SECTOR: ACQUIRING</span>
    </div>
  </div>

  <!-- Mode Selector -->
  <div class="mode-controls">
    <button id="btn-intel" class="mode-btn active" onclick="setMode('intel')">Global Intel</button>
    <button id="btn-track" class="mode-btn" onclick="setMode('track')">Tactical Satellite</button>
  </div>

  <script>
    const OCI_HOST = "92.4.87.82:8000";
    const CLIENT_ID = "alpha_nord_01";
    let currentMode = "intel";
    let ws = null;
    let map = null;
    let markers = {};
    let myPosition = { lat: 0, lon: 0 };
    let sectorCircle = null;

    // --- ROLLING CACHE CONSTANTS ---
    let currentAnchor = null;
    const DRIFT_THRESHOLD_KM = 30.0;
    const BUFFER_RADIUS_KM = 60.0;

    // --- IndexedDB Setup ---
    const db = new Dexie("HrishiOfflineMapTiles");
    db.version(1).stores({ tiles: "key,data,timestamp" });

    const OfflineTileLayer = L.TileLayer.extend({
      createTile: function(coords, done) {
        const tile = document.createElement('img');
        const url = this.getTileUrl(coords);
        const tileKey = `${coords.z}_${coords.x}_${coords.y}`;

        db.tiles.get(tileKey).then((savedTile) => {
          if (savedTile && savedTile.data) {
            tile.src = savedTile.data;
            done(null, tile);
          } else {
            fetch(url)
              .then(res => res.blob())
              .then(blob => {
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                  const base64Data = reader.result;
                  tile.src = base64Data;
                  db.tiles.put({ key: tileKey, data: base64Data, timestamp: Date.now() });
                  done(null, tile);
                };
              })
              .catch(err => done(err, tile));
          }
        }).catch(() => {
          tile.src = url;
          done(null, tile);
        });

        return tile;
      }
    });

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    async function checkRollingBuffer(lat, lon) {
      if (!currentAnchor) {
        await refreshRollingPatch(lat, lon);
        return;
      }
      const drift = getDistanceKm(currentAnchor.lat, currentAnchor.lon, lat, lon);
      if (drift >= DRIFT_THRESHOLD_KM) {
        await refreshRollingPatch(lat, lon);
      }
    }

    async function refreshRollingPatch(lat, lon) {
      const badge = document.getElementById("offline-status");
      badge.textContent = "SYNCING SECTOR...";
      badge.style.color = "var(--neon-cyan)";

      try {
        await fetch(`http://${OCI_HOST}/api/map/patch-metadata?lat=${lat}&lon=${lon}&radius=${BUFFER_RADIUS_KM}`);
        await db.tiles.clear(); // Evict obsolete patch

        currentAnchor = { lat, lon };
        badge.textContent = `SECTOR CACHED (${BUFFER_RADIUS_KM}km)`;
        badge.style.color = "var(--neon-green)";

        if (map) {
          if (sectorCircle) map.removeLayer(sectorCircle);
          sectorCircle = L.circle([lat, lon], {
            radius: BUFFER_RADIUS_KM * 1000,
            color: '#00f0ff',
            weight: 1,
            fillColor: '#00f0ff',
            fillOpacity: 0.05
          }).addTo(map);
        }
      } catch (err) {
        badge.textContent = "OFFLINE // PERSISTED";
        badge.style.color = "var(--neon-green)";
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("btn-intel").classList.toggle("active", mode === "intel");
      document.getElementById("btn-track").classList.toggle("active", mode === "track");

      if (mode === "intel") {
        document.getElementById("globe-container").style.display = "block";
        document.getElementById("satellite-container").style.display = "none";
      } else {
        document.getElementById("globe-container").style.display = "none";
        document.getElementById("satellite-container").style.display = "block";
        initSatelliteMap();
        if (myPosition.lat !== 0) map.setView([myPosition.lat, myPosition.lon], 15);
      }
    }

    function initSatelliteMap() {
      if (map) {
        map.invalidateSize();
        return;
      }
      map = L.map('satellite-container', { zoomControl: false }).setView([26.8467, 80.9462], 12);
      const sat = new OfflineTileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 19, attribution: 'Esri Satellite' }
      );
      sat.addTo(map);
    }

    function updateMapPins(nodes) {
      if (!map) return;
      for (const id in nodes) {
        const node = nodes[id];
        const isSelf = (id === CLIENT_ID);
        const color = isSelf ? "#00ff66" : "#00f0ff";
        const label = isSelf ? "YOU (ALPHA)" : (node.name || id);

        if (!markers[id]) {
          markers[id] = L.circleMarker([node.lat, node.lon], {
            radius: 8, fillColor: color, color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.9
          }).addTo(map).bindPopup(`<b>${label}</b>`);
        } else {
          markers[id].setLatLng([node.lat, node.lon]);
        }
      }
    }

    let scene, camera, renderer, controls, cloudsMesh;
    function initGlobe() {
      const container = document.getElementById("globe-container");
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 210;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const texLoader = new THREE.TextureLoader();

      const globe = new THREE.Mesh(
        new THREE.SphereGeometry(70, 64, 64),
        new THREE.MeshPhongMaterial({
          map: texLoader.load("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"),
          specular: 0x222222, shininess: 15
        })
      );
      scene.add(globe);

      cloudsMesh = new THREE.Mesh(
        new THREE.SphereGeometry(71.2, 64, 64),
        new THREE.MeshPhongMaterial({
          map: texLoader.load("https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_clouds_1024.png"),
          transparent: true, opacity: 0.4
        })
      );
      scene.add(cloudsMesh);

      function animate() {
        requestAnimationFrame(animate);
        if (cloudsMesh) cloudsMesh.rotation.y += 0.0003;
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function connectSocket() {
      try {
        ws = new WebSocket("ws://" + OCI_HOST + "/ws/" + CLIENT_ID + "?token=ENCRYPTED_ALPHA_ROOT_TOKEN");
        ws.onopen = () => {
          document.getElementById("net-badge").style.background = "var(--neon-green)";
          document.getElementById("node-status").textContent = "ALPHA // ONLINE";
        };
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "FLEET_GPS_SYNC" && data.nodes) updateMapPins(data.nodes);
          } catch (e) {}
        };
        ws.onclose = () => {
          document.getElementById("net-badge").style.background = "var(--neon-red)";
          document.getElementById("node-status").textContent = "STANDBY // OFFLINE";
          setTimeout(connectSocket, 4000);
        };
      } catch (err) {
        document.getElementById("net-badge").style.background = "var(--neon-red)";
      }
    }

    function initGeolocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          myPosition.lat = pos.coords.latitude;
          myPosition.lon = pos.coords.longitude;
          checkRollingBuffer(myPosition.lat, myPosition.lon);

          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: "TELEMETRY_UPDATE",
              lat: myPosition.lat,
              lon: myPosition.lon,
              name: "Hrishi (Alpha)",
              timestamp: Date.now()
            }));
          }
        }, null, { enableHighAccuracy: true });
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      initGlobe();
      connectSocket();
      initGeolocation();
    });
  </script>
</body>
</html>
