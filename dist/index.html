<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HRISHI</title>
  
  <!-- Three.js for 3D Globe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Leaflet for High-Res Street Satellite Imagery -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-green: #00ff66;
      --neon-red: #ff0055;
      --panel-bg: rgba(6, 11, 25, 0.85);
      --border-cyan: rgba(0, 240, 255, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }

    #globe-container, #satellite-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    #satellite-container { display: none; z-index: 10; }

    /* Top HUD Header */
    .hud-header {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100; pointer-events: none;
    }
    .status-badge {
      display: flex; align-items: center; gap: 8px;
      background: var(--panel-bg); border: 1px solid var(--border-cyan);
      padding: 6px 12px; border-radius: 4px; pointer-events: auto;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neon-red); }

    /* Mode Switch Controls */
    .mode-controls {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 100;
    }
    .mode-btn {
      background: var(--panel-bg); color: var(--neon-cyan);
      border: 1px solid var(--border-cyan); padding: 10px 18px;
      font-size: 11px; font-weight: bold; letter-spacing: 1px;
      border-radius: 4px; cursor: pointer; text-transform: uppercase;
    }
    .mode-btn.active {
      background: rgba(0, 240, 255, 0.25);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px var(--neon-cyan);
    }

    /* Intel News Feed Drawer */
    #intel-feed {
      position: absolute; bottom: 80px; left: 12px; right: 12px;
      max-height: 140px; overflow-y: auto; background: var(--panel-bg);
      border: 1px solid var(--border-cyan); border-radius: 4px;
      padding: 8px 12px; font-size: 11px; color: #fff; z-index: 100;
      display: block;
    }
    .news-item { margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
    .news-title { color: var(--neon-cyan); font-weight: bold; }

    /* Custom Leaflet Map styling */
    .leaflet-container { background: #000; }
  </style>
</head>
<body>

  <!-- Mode 1: 3D Holographic Globe -->
  <div id="globe-container"></div>

  <!-- Mode 2: Street-Level Satellite View -->
  <div id="satellite-container"></div>

  <!-- HUD Overlay -->
  <div class="hud-header">
    <div class="status-badge">
      <div id="net-badge" class="status-dot"></div>
      <span id="node-status" style="color: var(--neon-cyan);">INITIALIZING...</span>
    </div>
    <div class="status-badge">
      <span id="gps-coords" style="color: #fff;">GPS: ACQUIRING</span>
    </div>
  </div>

  <!-- News / Intel Drawer (Mode 1) -->
  <div id="intel-feed">
    <div style="color: var(--neon-cyan); font-weight: bold; margin-bottom: 4px;">// GLOBAL INTEL FEED</div>
    <div class="news-item">
      <div class="news-title">WEATHER & CLOUD TELEMETRY</div>
      <div>Satellite overlay live: global cloud layers synced.</div>
    </div>
    <div class="news-item">
      <div class="news-title">CORE NETWORK STATUS</div>
      <div>OCI Ampere node listening on port 8000.</div>
    </div>
  </div>

  <!-- Mode Toggle Buttons -->
  <div class="mode-controls">
    <button id="btn-intel" class="mode-btn active" onclick="setMode('intel')">Global Intel</button>
    <button id="btn-track" class="mode-btn" onclick="setMode('track')">Tactical Satellite</button>
  </div>

  <script>
    const OCI_HOST = "92.4.87.82:8000";
    const CLIENT_ID = "alpha_nord_01"; // Unique device ID
    let currentMode = "intel";
    let ws = null;
    let map = null;
    let markers = {};
    let myPosition = { lat: 0, lon: 0 };

    // --- Mode Switcher ---
    function setMode(mode) {
      currentMode = mode;
      document.getElementById("btn-intel").classList.toggle("active", mode === "intel");
      document.getElementById("btn-track").classList.toggle("active", mode === "track");

      if (mode === "intel") {
        document.getElementById("globe-container").style.display = "block";
        document.getElementById("satellite-container").style.display = "none";
        document.getElementById("intel-feed").style.display = "block";
      } else {
        document.getElementById("globe-container").style.display = "none";
        document.getElementById("satellite-container").style.display = "block";
        document.getElementById("intel-feed").style.display = "none";
        initSatelliteMap();
        if (myPosition.lat !== 0) {
          map.setView([myPosition.lat, myPosition.lon], 16); // Street-level zoom
        }
      }
    }

    // --- High-Resolution Street Satellite Map (Leaflet + Esri) ---
    function initSatelliteMap() {
      if (map) {
        map.invalidateSize();
        return;
      }

      // Esri World Imagery (High-res satellite tiles down to street level, free)
      map = L.map('satellite-container', { zoomControl: false }).setView([20.5937, 78.9629], 5);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Esri Satellite'
      }).addTo(map);
    }

    function updateMapPins(nodes) {
      if (!map) return;
      for (const id in nodes) {
        const node = nodes[id];
        const isSelf = (id === CLIENT_ID);
        const color = isSelf ? "#00ff66" : "#00f0ff";
        const label = isSelf ? "YOU (ALPHA)" : (node.name || id);

        if (!markers[id]) {
          const circle = L.circleMarker([node.lat, node.lon], {
            radius: 8,
            fillColor: color,
            color: "#fff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup(`<b>${label}</b><br>Lat: ${node.lat.toFixed(4)}<br>Lon: ${node.lon.toFixed(4)}`);
          markers[id] = circle;
        } else {
          markers[id].setLatLng([node.lat, node.lon]);
        }
      }
    }

    // --- Mode 1: Three.js 3D Globe with Clouds ---
    let scene, camera, renderer, controls, cloudsMesh;
    function initGlobe() {
      const container = document.getElementById("globe-container");
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 210;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 75;
      controls.maxDistance = 350;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const texLoader = new THREE.TextureLoader();
      // Base Globe
      const globeGeo = new THREE.SphereGeometry(70, 64, 64);
      const globeMat = new THREE.MeshPhongMaterial({
        map: texLoader.load("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"),
        specular: 0x222222,
        shininess: 15
      });
      const globe = new THREE.Mesh(globeGeo, globeMat);
      scene.add(globe);

      // Cloud Layer
      const cloudGeo = new THREE.SphereGeometry(71.2, 64, 64);
      const cloudMat = new THREE.MeshPhongMaterial({
        map: texLoader.load("https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_clouds_1024.png"),
        transparent: true,
        opacity: 0.4
      });
      cloudsMesh = new THREE.Mesh(cloudGeo, cloudMat);
      scene.add(cloudsMesh);

      function animate() {
        requestAnimationFrame(animate);
        if (cloudsMesh) cloudsMesh.rotation.y += 0.0003;
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    // --- WebSocket Telemetry & Sync ---
    function connectSocket() {
      const badge = document.getElementById("net-badge");
      const statusText = document.getElementById("node-status");

      try {
        ws = new WebSocket("ws://" + OCI_HOST + "/ws/" + CLIENT_ID + "?token=ENCRYPTED_ALPHA_ROOT_TOKEN");

        ws.onopen = () => {
          badge.style.background = "var(--neon-green)";
          statusText.textContent = "ALPHA // ONLINE";
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "FLEET_GPS_SYNC" && data.nodes) {
              updateMapPins(data.nodes);
            }
          } catch (e) {}
        };

        ws.onclose = () => {
          badge.style.background = "var(--neon-red)";
          statusText.textContent = "OFFLINE // RETRYING";
          setTimeout(connectSocket, 4000);
        };
      } catch (err) {
        badge.style.background = "var(--neon-red)";
      }
    }

    // --- GPS Tracker: Posts Coordinates to Server ---
    function initGeolocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          myPosition.lat = pos.coords.latitude;
          myPosition.lon = pos.coords.longitude;
          document.getElementById("gps-coords").textContent = 
            `GPS: ${myPosition.lat.toFixed(3)}, ${myPosition.lon.toFixed(3)}`;

          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: "TELEMETRY_UPDATE",
              lat: myPosition.lat,
              lon: myPosition.lon,
              name: "Hrishi (Alpha)",
              timestamp: Date.now()
            }));
          }
        }, null, { enableHighAccuracy: true });
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      initGlobe();
      connectSocket();
      initGeolocation();
    });
  </script>
</body>
</html>
